[package]
name = "sportinox-catalogo-balcao"
version = "1.0.0"
description = "Catálogo Eletrônico Inteligente de Balcão Offline-First — Adesivos Resinados & PPF"
authors = ["Wallace de Paula Soares"]
edition = "2021"

[lib]
name = "sportinox_catalogo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
